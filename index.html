<!DOCTYPE html>
<html lang="de" class="h-full bg-[#F8F9FA]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GourmetChef - Meine Rezeptwelt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { cooking: '#E05A47', cookingHover: '#C94A38', baking: '#E6A100', slateDark: '#2D3142', slateMuted: '#6C727F' },
                    boxShadow: { 'soft': '0 4px 20px -2px rgba(45, 49, 66, 0.05)' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; color: #2D3142; background-color: #F8F9FA; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-full flex flex-col antialiased text-[#2D3142]">

    <div id="app" class="min-h-screen flex flex-col pb-24 md:pb-8">
        <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-gray-100 shadow-sm">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16 sm:h-20">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('recipes')">
                        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center text-white shadow-md">
                            <i class="fa-solid font-bold fa-utensils text-lg"></i>
                        </div>
                        <div>
                            <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-cooking via-amber-600 to-baking bg-clip-text text-transparent">GourmetChef</span>
                        </div>
                    </div>
                    <button onclick="openImportModal()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slateDark text-white font-semibold text-sm shadow-md">
                        <i class="fa-solid fa-plus text-amber-400"></i>
                        <span>Neues Rezept</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div id="view-recipes" class="space-y-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-slateDark flex items-center gap-2">
                        <span>Meine Rezepte</span>
                        <span id="recipe-count-badge" class="bg-gray-200 text-slateDark text-xs px-2.5 py-0.5 rounded-full">0</span>
                    </h2>
                </div>
                <div id="recipes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                <div id="empty-state" class="hidden text-center py-16 px-4 bg-white rounded-3xl border border-dashed border-gray-200">
                    <h3 class="text-lg font-bold text-slateDark mb-1">Noch keine Rezepte da</h3>
                    <p class="text-sm text-slateMuted mb-4">Erstelle dein erstes Rezept!</p>
                    <button onclick="openImportModal()" class="px-5 py-2.5 bg-cooking text-white font-bold text-sm rounded-xl">Neues Rezept</button>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="recipe-modal" class="hidden fixed inset-0 bg-slateDark/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-elevated">
            <h3 class="font-extrabold text-lg text-slateDark mb-4">Neues Rezept hinzufügen</h3>
            <form onsubmit="saveRecipeFromForm(event)" class="space-y-4">
                <input type="text" id="form-title" required placeholder="Titel (z. B. Pfannkuchen)" class="w-full px-4 py-2 bg-gray-50 border rounded-xl">
                <textarea id="form-ingredients" required placeholder="Zutaten (eine pro Zeile)" class="w-full px-4 py-2 bg-gray-50 border rounded-xl"></textarea>
                <textarea id="form-instructions" required placeholder="Zubereitung" class="w-full px-4 py-2 bg-gray-50 border rounded-xl"></textarea>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeImportModal()" class="px-4 py-2 border rounded-xl">Abbrechen</button>
                    <button type="submit" class="px-4 py-2 bg-cooking text-white rounded-xl">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let recipes = [];

        function initApp() {
            const savedRecipes = localStorage.getItem('gourmetchef_recipes');
            if (savedRecipes) {
                try { recipes = JSON.parse(savedRecipes); } catch (e) { recipes = []; }
            }
            renderRecipes();
        }

        function saveRecipesToStorage() {
            localStorage.setItem('gourmetchef_recipes', JSON.stringify(recipes));
            if (window.saveToCloud) window.saveToCloud(recipes);
        }

        function renderRecipes() {
            const grid = document.getElementById('recipes-grid');
            document.getElementById('recipe-count-badge').textContent = recipes.length;
            document.getElementById('empty-state').classList.toggle('hidden', recipes.length > 0);
            grid.innerHTML = recipes.map(r => `
                <div class="bg-white rounded-3xl p-5 shadow-soft border border-gray-100">
                    <h3 class="font-extrabold text-slateDark text-base">${r.title}</h3>
                    <p class="text-xs text-slateMuted mt-2">${r.ingredients ? r.ingredients.length : 0} Zutaten</p>
                </div>
            `).join('');
        }

        function openImportModal() { document.getElementById('recipe-modal').classList.remove('hidden'); }
        function closeImportModal() { document.getElementById('recipe-modal').classList.add('hidden'); }

        function saveRecipeFromForm(e) {
            e.preventDefault();
            const newRecipe = {
                id: 'rec-' + Date.now(),
                title: document.getElementById('form-title').value.trim(),
                ingredients: document.getElementById('form-ingredients').value.split('\n').filter(Boolean),
                instructions: document.getElementById('form-instructions').value.split('\n').filter(Boolean)
            };
            recipes.unshift(newRecipe);
            saveRecipesToStorage();
            closeImportModal();
            renderRecipes();
        }

        window.onload = initApp;
    </script>

    <!-- FIREBASE SYNCHRONISATION -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCOMpewZO0VzMDOvsx6AbEJAKnFDRKUlus",
        authDomain: "gourmetchef-24773.firebaseapp.com",
        projectId: "gourmetchef-24773",
        storageBucket: "gourmetchef-24773.firebasestorage.app",
        messagingSenderId: "211718443592",
        appId: "1:211718443592:web:53220caac60e1c494f3e7d",
        measurementId: "G-V8G9M7JXDR"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const docRef = doc(db, "appData", "shared");

      window.saveToCloud = async function(recipesData) {
        try {
          await setDoc(docRef, { recipes: recipesData, updatedAt: new Date().toISOString() });
        } catch (e) { console.error("Cloud-Error:", e); }
      };

      // Auf Cloud-Änderungen hören, aber LOKALE Daten schützen
      onSnapshot(docRef, (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.data();
          if (data.recipes && data.recipes.length > 0) {
            recipes = data.recipes;
            localStorage.setItem('gourmetchef_recipes', JSON.stringify(recipes));
            renderRecipes();
          } else if (recipes.length > 0) {
            // Falls Cloud leer ist, aber lokal Daten da sind: Hochladen!
            window.saveToCloud(recipes);
          }
        } else if (recipes.length > 0) {
          window.saveToCloud(recipes);
        }
      });
    </script>
</body>
</html>
